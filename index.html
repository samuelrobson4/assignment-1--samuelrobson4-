<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Task Manager</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header class="site-header">
            <div class="header-left">
                <img class="header-icon menu-icon" src="assets/menu_icon.png" alt="Menu">
                <form class="quick-find">
                    <img class="header-icon search-icon" src="assets/search_icon.png" alt="">
                    <input type="text" id="quick-find" placeholder="Quick find">
                </form>
            </div>
            <div class="header-counter">
                <img class="header-icon check-icon" src="assets/check_icon.png" alt="">
                <span class="task-counter">30/5</span>
            </div>
        </header>
        <div class="page-layout">
            <nav class="sidebar">
            <ul class="sidebar-list">
                <li>
                    <a href="#">
                        <img src="assets/inbox_icon.png" alt="">
                        <span class="nav-label">Inbox</span>
                        <span class="nav-count">5</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="assets/calendar_icon.png" alt="">
                        <span class="nav-label">Today</span>
                        <span class="nav-count">5</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="assets/upcoming_icon.png" alt="">
                        <span class="nav-label">Upcoming</span>
                    </a>
                </li>
            </ul>
            </nav>
            <main class="main-content">
            <section>
            <h1>Inbox</h1>
            <ul class="task-list">
                <li class="task-item">
                    <input type="checkbox" class="task-checkbox" id="task-1">
                    <label for="task-1">Call Mom</label>
                </li>
                <li class="task-item">
                    <input type="checkbox" class="task-checkbox" id="task-2">
                    <label for="task-2">Buy the new issue of Scientific American</label>
                </li>
                <li class="task-item">
                    <input type="checkbox" class="task-checkbox" id="task-3">
                    <label for="task-3">Return the textbook to Josie</label>
                </li>
                <li class="task-item">
                    <input type="checkbox" class="task-checkbox" id="task-4">
                    <label for="task-4">Buy the new album by Rake</label>
                </li>
                <li class="task-item">
                    <input type="checkbox" class="task-checkbox" id="task-5">
                    <label for="task-5">Buy a gift card for Dad</label>
                </li>
            </ul>
            </section>
            </main>
        </div>
    </body>
</html>
